name: Check and deploy mobile preview

on:
  push:
    branches: ['main']

concurrency:
  group: mobile-preview

jobs:
  check:
    name: Typecheck and bundle
    environment: preview
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - run: npm run typecheck
      - run: npx expo export --platform ios --platform android

  fingerprint:
    name: Check native fingerprint
    needs: [check]
    type: fingerprint
    environment: preview

  existing_android:
    name: Find compatible Android build
    needs: [fingerprint]
    type: get-build
    params:
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}
      profile: preview

  build_android:
    name: Build Android preview APK
    needs: [existing_android]
    if: ${{ !needs.existing_android.outputs.build_id }}
    type: build
    params:
      platform: android
      profile: preview

  update:
    name: Publish compatible preview update
    needs: [check]
    type: update
    environment: preview
    params:
      channel: preview
